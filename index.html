<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Browser-based General Relativity simulation and scientific visualization laboratory" />
    <title>GR-4D Simulator v0.7.0</title>
  </head>
  <body>
    <div id="app">
      <header id="top-bar" class="top-bar"></header>
      <aside id="control-panel" class="side-panel simulation-panel"></aside>
      <main id="viewport-shell">
        <div id="viewport" data-i18n-aria="camera.viewport"></div>
        <div class="viewport-mode" aria-hidden="true"><span data-i18n="model.active"></span><strong data-i18n="model.name"></strong></div>
        <div class="camera-guide" aria-hidden="true"><span data-i18n="camera.orbitHint"></span><span data-i18n="camera.panHint"></span><span data-i18n="camera.zoomHint"></span></div>
        <div class="reticle" aria-hidden="true"></div>
      </main>
      <aside id="visual-settings-panel" class="side-panel visual-panel"></aside>
      <footer class="status-strip">
        <span><i class="status-dot"></i><span data-i18n="status.rendererOnline"></span></span>
        <span><span data-i18n="status.fixedStep"></span><strong>1 / 240 s</strong></span>
        <span><span data-i18n="status.camera"></span><strong data-i18n="status.cameraControls"></strong></span>
        <span class="status-note" data-i18n="status.scope"></span>
      </footer>
      <button id="panel-backdrop" class="panel-backdrop" type="button" data-i18n-aria="drawer.close" hidden></button>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
