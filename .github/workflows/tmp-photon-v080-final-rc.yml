name: Temporary Photon v0.8.0 Final RC Validation
on:
  push:
    branches:
      - tmp/photon-v080-final-rc-validation
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply isolated release bookkeeping
        run: node scripts/tmp-photon-v080-prep.mjs
      - name: Audit final product diff before tests
        shell: bash
        run: |
          set -euo pipefail
          BASE=594284ddd01882534e844faaa7699c48a8dde43c
          git diff --exit-code "$BASE" -- src/physics src/systems/SchwarzschildParticleSubsystem.js
          git diff --check "$BASE" -- . ':(exclude).github/workflows/tmp-photon-v080-final-rc.yml' ':(exclude)scripts/tmp-photon-v080-prep.mjs'
          git diff --name-only "$BASE" -- . ':(exclude).github/workflows/tmp-photon-v080-final-rc.yml' ':(exclude)scripts/tmp-photon-v080-prep.mjs' | sort > /tmp/actual-files.txt
          cat > /tmp/allowed-files.txt <<'EOF'
          CHANGELOG.md
          README.md
          docs/PHOTON_FOUNDATION.md
          docs/PHYSICS.md
          index.html
          package-lock.json
          package.json
          src/core/constants.js
          src/ui/i18n/en.js
          src/ui/i18n/ko.js
          tests/e2e/app.smoke.spec.js
          tests/e2e/photon-foundation.smoke.spec.js
          tests/unit/i18n.test.js
          EOF
          sed -i 's/^          //' /tmp/allowed-files.txt
          sort -o /tmp/allowed-files.txt /tmp/allowed-files.txt
          diff -u /tmp/allowed-files.txt /tmp/actual-files.txt
          if git diff --name-only "$BASE" -- .github | grep -v '^.github/workflows/tmp-photon-v080-final-rc.yml$' | grep -q .; then
            echo 'Unexpected CI diff' >&2
            exit 1
          fi
      - name: Audit package metadata-only change
        shell: bash
        run: |
          set -euo pipefail
          BASE=594284ddd01882534e844faaa7699c48a8dde43c
          git show "$BASE:package.json" > /tmp/base-package.json
          git show "$BASE:package-lock.json" > /tmp/base-lock.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const basePackage = JSON.parse(fs.readFileSync('/tmp/base-package.json', 'utf8'));
          const nextPackage = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (nextPackage.version !== '0.8.0') throw new Error('package.json version is not 0.8.0');
          nextPackage.version = basePackage.version;
          if (JSON.stringify(nextPackage) !== JSON.stringify(basePackage)) throw new Error('package.json changed beyond version metadata');
          const baseLock = JSON.parse(fs.readFileSync('/tmp/base-lock.json', 'utf8'));
          const nextLock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (nextLock.version !== '0.8.0' || nextLock.packages?.['']?.version !== '0.8.0') throw new Error('package-lock root versions are not 0.8.0');
          nextLock.version = baseLock.version;
          nextLock.packages[''].version = baseLock.packages[''].version;
          if (JSON.stringify(nextLock) !== JSON.stringify(baseLock)) throw new Error('package-lock changed beyond root version metadata');
          NODE
      - name: Confirm release scope text and no stale current version
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'WebGPU/WASM photon acceleration' docs/PHOTON_FOUNDATION.md README.md CHANGELOG.md docs/PHYSICS.md
          grep -F 'b_crit = (3√3/2) r_s' docs/PHOTON_FOUNDATION.md CHANGELOG.md docs/PHYSICS.md
          ! grep -R 'v0.7.11' index.html src/core/constants.js src/ui/i18n/en.js src/ui/i18n/ko.js tests/unit/i18n.test.js tests/e2e/app.smoke.spec.js package.json package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Full unit suite
        run: npm run test
      - name: Full physics suite
        run: npm run test:physics
      - name: Full massive/timelike regression focus
        run: npx vitest run tests/physics/schwarzschild-validation.test.js tests/unit/schwarzschild-geodesics.test.js tests/unit/schwarzschild-particle-subsystem.test.js tests/unit/geodesic-motion-pipeline.test.js tests/unit/simulation-integration.test.js
      - name: Photon regression focus
        run: npx vitest run tests/physics/schwarzschild-null-validation.test.js tests/physics/schwarzschild-photon-reference.test.js tests/physics/schwarzschild-photon-deflection.test.js tests/unit/photon-bundles.test.js tests/unit/photon-light-bending.test.js tests/unit/photon-performance-gate.test.js tests/unit/photon-rendering.test.js tests/unit/photon-inspector.test.js
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile Photon Foundation smoke
        env:
          CI: ""
        run: npx playwright test tests/e2e/photon-foundation.smoke.spec.js --project=chromium --reporter=list
      - name: Commit validated release-ready files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md README.md docs/PHOTON_FOUNDATION.md docs/PHYSICS.md index.html package-lock.json package.json src/core/constants.js src/ui/i18n/en.js src/ui/i18n/ko.js tests/e2e/app.smoke.spec.js tests/e2e/photon-foundation.smoke.spec.js tests/unit/i18n.test.js
          git commit -m "chore(release): finalize v0.8.0 photon foundation"
          git push origin HEAD:tmp/photon-v080-final-rc-validation
